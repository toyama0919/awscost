[project]
name = "awscost"
version = "0.4.0"
description = "Command Line utility for cost of aws."
authors = [{ name="Hiroshi Toyama", email="toyama0919@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
keywords = [
  "awscost",
  "tool",
  "aws",
]
requires-python = ">=3.10"
dependencies = [
  "tabulate>=0.10.0,<1.0",
  "boto3>=1.40.0,<2.0",
  "click>=8.1,<9.0",
  "pyyaml>=6.0.3,<7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.optional-dependencies]
test = [
  "pytest>=9.0,<10.0",
  "mock>=5.2,<6.0",
  "build>=1.3,<2.0",
  "ruff>=0.17,<1.0",
]

[project.scripts]
awscost = "awscost.commands:main"

[project.urls]
"Homepage" = "https://github.com/toyama0919/awscost"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["awscost"]
force-sort-within-sections = true
