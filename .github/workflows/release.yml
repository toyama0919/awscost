name: release

on:
  push:
    tags:
    - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/awscost

    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: build
      run: |
        python -m pip install --upgrade build
        python -m build -s

    - name: publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
